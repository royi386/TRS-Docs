services:
  rail-docs:
    build: .
    image: ghcr.io/royi386/trs-docs:latest
    container_name: rail-docs
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      ADMIN_PASSWORD: 12345678
      PORT: 3000
      DB_PATH: /app/data/smi_tc.db
      UPLOAD_DIR: /app/uploads

      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434

      # --- Local models ---
      # qwen3:4b is the sweet spot for the i5-12400: roughly twice the tokens
      # per second of the 7b, and the app already sends /no_think so the hybrid
      # reasoning block is skipped.
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:4b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}

      RAG_RESCAN_INTERVAL_MS: 300000

      # --- OCR ---
      RAG_OCR: "1"
      RAG_OCR_LANGS: eng+hin
      RAG_OCR_CACHE_DIR: /app/ocr-cache
      # OCR documents up to this many pages (some scans run to hundreds).
      RAG_OCR_MAX_PAGES: "800"
      # OCR every page (not just pages with no text layer): scanner text layers
      # often hold only a watermark like "Scanned by CamScanner".
      RAG_OCR_ALL: "1"
      # Keep the native text layer alongside the OCR reading of the same page.
      RAG_OCR_MERGE_LAYER: "1"

    volumes:
      - D:/TRS_Docs/data:/app/data
      - D:/TRS_Docs/uploads:/app/uploads
      - D:/TRS_Docs/ocr-cache:/app/ocr-cache

    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: rail-docs-ollama
    restart: unless-stopped

    volumes:
      # Ollama models are stored on the Windows D: drive.
      - D:/TRS_Docs/ollama:/root/.ollama

    environment:
      OLLAMA_MAX_LOADED_MODELS: "2"
      # One request at a time. Parallel slots split the CPU between concurrent
      # generations, which made every single answer slower; requests now queue
      # briefly instead (the app rate-limits to 12 questions/min per client).
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-300m}
      # Physical cores only (i5-12400 = 6P/12T). Hyper-threads add cache
      # contention during token generation without adding speed.
      OLLAMA_NUM_THREADS: ${OLLAMA_NUM_THREADS:-6}
      # Flash attention plus a q8_0 KV cache roughly halves the memory the
      # context occupies and speeds up long-prompt handling on CPU.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0

    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  ollama-models:
    image: ollama/ollama:latest
    container_name: rail-docs-ollama-models
    restart: "no"
    depends_on:
      - ollama

    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:4b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}

    entrypoint: ["/bin/sh", "-c"]

    command:
      - |
        until ollama list >/dev/null 2>&1; do
          echo "waiting for the ollama service..."
          sleep 3
        done

        for model in "$${OLLAMA_EMBED_MODEL}" "$${OLLAMA_CHAT_MODEL}"; do
          echo "downloading $${model}"
          ollama pull "$${model}" || exit 1
        done

        echo "models ready"