services:
  rail-docs:
    image: ghcr.io/royi386/trs-docs:latest
    container_name: rail-docs
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      ADMIN_PASSWORD: change-this-to-a-long-password
      PORT: 3000
      DB_PATH: /app/data/smi_tc.db
      UPLOAD_DIR: /app/uploads

    volumes:
      - /srv/dev-disk-by-uuid-92D8D25FD8D24161/TRS_Docs/data:/app/data
      - /srv/dev-disk-by-uuid-92D8D25FD8D24161/TRS_Docs/uploads:/app/uploads